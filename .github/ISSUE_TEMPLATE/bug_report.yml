name: Bug report
description: Report a reproducible defect (code, harness, docs, CI)
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Evidence-first: a bug without reproduction steps cannot be dispositioned.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed vs expected behavior, with file:line refs where possible
      validations:
        required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact commands, seeds, commit SHA, Python/OS version
      placeholder: |
        1. `python -m unittest discover -s . -p "test_*.py"`
        2. ...
      validations:
        required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (logs, JSON excerpts, ledger entries)
      description: Paste minimal excerpts; never paste proprietary RTL, VCD internals, keys, or credentials
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - router/ensemble
        - eval-harness
        - evidence/policy
        - adapters (sim/VCD/formal/UVM)
        - datasets
        - docs
        - CI
        - other
  - type: checkboxes
    id: checks
    attributes:
      label: Contributor checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I can reproduce on main at a pinned commit
          required: true
