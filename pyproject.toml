[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq-vericlave"
version = "0.9.0"
description = "AIQ-VeriClave: Evidence-first AI verification platform for silicon design"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Satish Sura", email = "satish@aiqi.in"}
]
maintainers = [
    {name = "AI-QUANTIC Insights", email = "info@aiqi.in"}
]
keywords = [
    "verification",
    "rtl",
    "formal",
    "sva",
    "uvm",
    "fpga",
    "asic",
    "evidence-ledger",
    "mutation-testing",
    "ai-verification"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev-tools = [
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=1.0",
]
ci = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/aiquanticinsights-commits/AIQ-VeriClave"
Repository = "https://github.com/aiquanticinsights-commits/AIQ-VeriClave"
Issues = "https://github.com/aiquanticinsights-commits/AIQ-VeriClave/issues"
Documentation = "https://aiqi.in/docs"
Changelog = "https://github.com/aiquanticinsights-commits/AIQ-VeriClave/blob/main/CHANGELOG.md"

[project.scripts]
vericlave = "router:main"
vericlave-eval = "eval_harness:main"
vericlave-router = "router:main"
vericlave-rewards = "rewards:main"
vericlave-p0 = "p0:main"
vericlave-p5 = "p5_execute:main"
vericlave-rerun = "p5_rerun:main"
vericlave-generate = "generate:main"
vericlave-intent = "intent:main"
vericlave-evidence = "evidence:main"
vericlave-policy = "policy:main"
vericlave-verify = "eval_harness:main"
vericlave-signoff = "simple_signoff:main"
vericlave-pilot = "pilot_assist:main"
vericlave-pilot-human = "pilot_human:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.yml", "*.yaml", "*.txt", "*.v", "*.sv", "*.svh", "*.tcl", "*.xdc"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow = marks tests as slow",
    "integration = marks tests as integration tests",
    "unit = marks tests as unit tests",
    "hardware = marks tests requiring hardware tools",
]
timeout = 300

[tool.mypy.ini_options]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ANN", "T20", "T10", "SIM", "PTH", "ERA", "PL", "TRY", "ARG", "RUF", "NPY", "PERF", "PLE", "RET", "ASYNC", "LOG", "TID", "PIE", "EXE", "TCH", "ISC", "PLW", "RSE", "PT"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.per-file-ignores]
"test_*.py" = ["S101", "D103"]
"scripts/*" = ["S101"]

[tool.coverage.run]
source = ["."]
omit = ["test_*", "*/test_*", "*/conftest.py", "*/setup.py", "*/conf.py", "*/docs/*"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:", "if False:", "if TYPE_CHECKING:"]
show_missing = true
precision = 2
